# SPDX-License-Identifier: 0BSD
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      GITEA_SERVER_URL: ${{ github.server_url }}
      REPOSITORY_NAME: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
      ACTIONLINT_OFFLINE: true
    steps:
      - name: Install build and validation tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl jq ca-certificates file xvfb zip desktop-file-utils libxml2-utils shellcheck

      - name: Check out from this Gitea repository
        run: |
          git init source
          cd source
          git remote add origin "${GITEA_SERVER_URL}/${REPOSITORY_NAME}.git"
          git -c http.extraHeader="Authorization: token ${GITEA_TOKEN}" fetch --depth 1 origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Build, test, cross-publish, smoke-test, and audit
        working-directory: source
        run: ./scripts/ci.sh
