# SPDX-License-Identifier: 0BSD
name: Build and release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      GITEA_SERVER_URL: ${{ github.server_url }}
      REPOSITORY_NAME: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
      REF_NAME: ${{ github.ref_name }}
      IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      ACTIONLINT_OFFLINE: true
    steps:
      - name: Install deterministic build and validation tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl jq ca-certificates file desktop-file-utils libxml2-utils shellcheck \
            xvfb xauth \
            libfontconfig1 libfreetype6 libharfbuzz0b \
            libx11-6 libxext6 libxrender1 libxcb1 libxi6 \
            libice6 libsm6 fonts-dejavu-core
          ldconfig

      - name: Check out from this Gitea repository
        run: |
          git init source
          cd source
          git remote add origin "${GITEA_SERVER_URL}/${REPOSITORY_NAME}.git"
          git -c http.extraHeader="Authorization: token ${GITEA_TOKEN}" fetch --depth 1 origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Test and build single-file Windows and Linux executables
        working-directory: source
        run: |
          if [ "${IS_RELEASE_TAG}" = "true" ]; then
            version="$(./scripts/project-version.sh "${REF_NAME}")"
            project_version="$(./scripts/project-version.sh)"
            if [ "${version}" != "${project_version}" ]; then
              echo "Release tag version ${version} does not match project version ${project_version}." >&2
              exit 1
            fi
            label="${REF_NAME}"
          else
            version="$(./scripts/project-version.sh)"
            label="manual-${COMMIT_SHA:0:7}"
          fi
          APP_VERSION="${version}" ./scripts/ci.sh
          ./scripts/prepare-release-assets.sh "${label}" "${GITHUB_WORKSPACE}/release"

      - name: Create or verify native Gitea release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          source/scripts/gitea-release-assets.sh "${REF_NAME}" \
            "${GITHUB_WORKSPACE}/release/SuikodenHdSaveEditor-${REF_NAME}-linux-x64" \
            "${GITHUB_WORKSPACE}/release/SuikodenHdSaveEditor-${REF_NAME}-windows-x64.exe"

  arch-package:
    needs: build
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      PACKAGE_PUBLISH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
      GITEA_PACKAGE_SERVER_URL: http://192.168.1.75:3001
      GITEA_SERVER_URL: ${{ github.server_url }}
      REPOSITORY_NAME: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
      REF_NAME: ${{ github.ref_name }}
      IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Install Arch build and validation tools
        run: |
          pacman -Syu --noconfirm --needed \
            git curl jq ca-certificates file namcap desktop-file-utils libxml2 diffutils tar gzip

      - name: Check out from this Gitea repository
        run: |
          git init source
          cd source
          git remote add origin "${GITEA_SERVER_URL}/${REPOSITORY_NAME}.git"
          git -c http.extraHeader="Authorization: token ${GITEA_TOKEN}" fetch --depth 1 origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Obtain single-file Linux package input
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/package-input" "${GITHUB_WORKSPACE}/packages"
          if [ "${IS_RELEASE_TAG}" = "true" ]; then
            version="$(source/scripts/project-version.sh "${REF_NAME}")"
            asset="SuikodenHdSaveEditor-${REF_NAME}-linux-x64"
            bundle="${GITHUB_WORKSPACE}/package-input/SuikodenHdSaveEditor-linux-x64"
            mkdir -p "${bundle}"
            release_json="$(curl --silent --show-error --fail \
              --header "Authorization: token ${GITEA_TOKEN}" \
              "${GITEA_SERVER_URL}/api/v1/repos/${REPOSITORY_NAME}/releases/tags/${REF_NAME}")"
            url="$(printf '%s' "${release_json}" | jq -er --arg name "${asset}" \
              '.assets[] | select(.name == $name) | .browser_download_url')"
            curl --silent --show-error --fail --location \
              --header "Authorization: token ${GITEA_TOKEN}" \
              --output "${bundle}/SuikodenHdSaveEditor.App" "${url}"
            chmod 0755 "${bundle}/SuikodenHdSaveEditor.App"
          else
            version="$(source/scripts/project-version.sh)"
            pacman -S --noconfirm --needed dotnet-sdk-10.0
            (
              cd source
              ./scripts/restore.sh
              ./scripts/test.sh
              APP_VERSION="${version}" ./scripts/publish-linux.sh
            )
            bundle="${GITHUB_WORKSPACE}/source/artifacts/publish/SuikodenHdSaveEditor-linux-x64"
          fi
          source/scripts/validate-package-input.sh "${bundle}"
          printf '%s\n' "${version}" > "${GITHUB_WORKSPACE}/package-version"
          printf '%s\n' "${bundle}" > "${GITHUB_WORKSPACE}/linux-bundle-path"
          pacman -S --noconfirm --needed fontconfig
          source/scripts/check-linux-native-dependencies.sh "${bundle}"

      - name: Build, install, and validate Arch package
        run: |
          version="$(cat "${GITHUB_WORKSPACE}/package-version")"
          bundle="$(cat "${GITHUB_WORKSPACE}/linux-bundle-path")"
          useradd --create-home builder
          chown -R builder:builder source "${GITHUB_WORKSPACE}/package-input" "${GITHUB_WORKSPACE}/packages"
          runuser -u builder -- env TMPDIR="${GITHUB_WORKSPACE}/source/.tools/package-tmp" \
            source/scripts/build-arch-package.sh "${version}" "${bundle}" "${GITHUB_WORKSPACE}/packages"
          package="${GITHUB_WORKSPACE}/packages/suikoden-hd-remaster-save-editor-${version}-1-x86_64.pkg.tar.zst"
          (
            cd source/packaging/arch
            runuser -u builder -- env PKGVER="${version}" makepkg --printsrcinfo
          )
          namcap source/packaging/arch/PKGBUILD "${package}"
          pacman -Qip "${package}"
          pacman -Qlp "${package}"
          # The archlinux container image ships NoExtract rules that skip
          # usr/share/doc, so the packaged notices and README would never reach
          # the filesystem. Clear them so the documentation this package
          # installs is actually installation-tested.
          sed -i '/^[[:space:]]*NoExtract[[:space:]]*=/d' /etc/pacman.conf
          pacman -U --noconfirm "${package}"
          source/scripts/validate-installed-package.sh
          cmp "${bundle}/SuikodenHdSaveEditor.App" \
            /usr/lib/suikoden-hd-remaster-save-editor/SuikodenHdSaveEditor.App
          checksum="$(source/scripts/package-checksum.sh "${package}")"
          (cd "$(dirname "${checksum}")" && sha256sum --check "$(basename "${checksum}")")

      - name: Smoke-test installed Arch package under Xvfb
        run: |
          pacman -S --noconfirm --needed xorg-server-xvfb xorg-xauth
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_CONFIG_HOME="${GITHUB_WORKSPACE}/.tools/smoke-config"
          mkdir -p "$XDG_CONFIG_HOME"
          timeout 30s xvfb-run -a -s "-screen 0 1280x800x24 -nolisten tcp" \
            suikoden-hd-remaster-save-editor --smoke-test

      - name: Publish immutable Arch package and release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cat "${GITHUB_WORKSPACE}/package-version")"
          package="${GITHUB_WORKSPACE}/packages/suikoden-hd-remaster-save-editor-${version}-1-x86_64.pkg.tar.zst"
          source/scripts/gitea-publish-package.sh \
            arch Robert robert suikoden-hd-remaster-save-editor "${version}" "${package}"
          source/scripts/gitea-release-assets.sh "${REF_NAME}" "${package}"

  rpm-package:
    needs: build
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
      PACKAGE_PUBLISH_TOKEN: ${{ secrets.PACKAGE_PUBLISH_TOKEN }}
      GITEA_PACKAGE_SERVER_URL: http://192.168.1.75:3001
      GITEA_SERVER_URL: ${{ github.server_url }}
      REPOSITORY_NAME: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}
      REF_NAME: ${{ github.ref_name }}
      IS_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - name: Install Fedora build and validation tools
        run: |
          dnf install -y \
            git curl jq ca-certificates file findutils rpm-build rpmdevtools rpmlint \
            desktop-file-utils libxml2 util-linux diffutils tar gzip

      - name: Check out from this Gitea repository
        run: |
          git init source
          cd source
          git remote add origin "${GITEA_SERVER_URL}/${REPOSITORY_NAME}.git"
          git -c http.extraHeader="Authorization: token ${GITEA_TOKEN}" fetch --depth 1 origin "${COMMIT_SHA}"
          git checkout --detach FETCH_HEAD

      - name: Obtain single-file Linux package input
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/package-input" "${GITHUB_WORKSPACE}/packages"
          if [ "${IS_RELEASE_TAG}" = "true" ]; then
            version="$(source/scripts/project-version.sh "${REF_NAME}")"
            asset="SuikodenHdSaveEditor-${REF_NAME}-linux-x64"
            bundle="${GITHUB_WORKSPACE}/package-input/SuikodenHdSaveEditor-linux-x64"
            mkdir -p "${bundle}"
            release_json="$(curl --silent --show-error --fail \
              --header "Authorization: token ${GITEA_TOKEN}" \
              "${GITEA_SERVER_URL}/api/v1/repos/${REPOSITORY_NAME}/releases/tags/${REF_NAME}")"
            url="$(printf '%s' "${release_json}" | jq -er --arg name "${asset}" \
              '.assets[] | select(.name == $name) | .browser_download_url')"
            curl --silent --show-error --fail --location \
              --header "Authorization: token ${GITEA_TOKEN}" \
              --output "${bundle}/SuikodenHdSaveEditor.App" "${url}"
            chmod 0755 "${bundle}/SuikodenHdSaveEditor.App"
          else
            version="$(source/scripts/project-version.sh)"
            dnf install -y dotnet-sdk-10.0
            (
              cd source
              ./scripts/restore.sh
              ./scripts/test.sh
              APP_VERSION="${version}" ./scripts/publish-linux.sh
            )
            bundle="${GITHUB_WORKSPACE}/source/artifacts/publish/SuikodenHdSaveEditor-linux-x64"
          fi
          source/scripts/validate-package-input.sh "${bundle}"
          printf '%s\n' "${version}" > "${GITHUB_WORKSPACE}/package-version"
          printf '%s\n' "${bundle}" > "${GITHUB_WORKSPACE}/linux-bundle-path"
          dnf install -y fontconfig
          source/scripts/check-linux-native-dependencies.sh "${bundle}"

      - name: Build, install, and validate RPM package
        run: |
          version="$(cat "${GITHUB_WORKSPACE}/package-version")"
          bundle="$(cat "${GITHUB_WORKSPACE}/linux-bundle-path")"
          useradd --create-home builder
          chown -R builder:builder source "${GITHUB_WORKSPACE}/package-input" "${GITHUB_WORKSPACE}/packages"
          runuser -u builder -- env TMPDIR="${GITHUB_WORKSPACE}/source/.tools/package-tmp" \
            source/scripts/build-rpm-package.sh "${version}" "${bundle}" "${GITHUB_WORKSPACE}/packages"
          package="${GITHUB_WORKSPACE}/packages/suikoden-hd-remaster-save-editor-${version}-1.x86_64.rpm"
          rpmlint -r source/packaging/rpm/rpmlintrc \
            source/packaging/rpm/suikoden-hd-remaster-save-editor.spec "${package}"
          rpm --checksig "${package}"
          rpm -qip "${package}"
          rpm -qlp "${package}"
          rpm -qpR "${package}"
          # Fedora's minimal container defaults to tsflags=nodocs. Clear it so
          # the package's licenses and notices are actually installation-tested.
          dnf install -y --setopt=install_weak_deps=False --setopt=tsflags= "${package}"
          source/scripts/validate-installed-package.sh
          cmp "${bundle}/SuikodenHdSaveEditor.App" \
            /usr/lib/suikoden-hd-remaster-save-editor/SuikodenHdSaveEditor.App
          checksum="$(source/scripts/package-checksum.sh "${package}")"
          (cd "$(dirname "${checksum}")" && sha256sum --check "$(basename "${checksum}")")

      - name: Smoke-test installed RPM package under Xvfb
        run: |
          dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth
          export LIBGL_ALWAYS_SOFTWARE=1
          export XDG_CONFIG_HOME="${GITHUB_WORKSPACE}/.tools/smoke-config"
          mkdir -p "$XDG_CONFIG_HOME"
          Xvfb :99 -screen 0 1280x800x24 -nolisten tcp \
            >"${GITHUB_WORKSPACE}/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "${xvfb_pid}" 2>/dev/null || true' EXIT
          sleep 2
          DISPLAY=:99 timeout 30s suikoden-hd-remaster-save-editor --smoke-test

      - name: Publish immutable RPM package and release assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(cat "${GITHUB_WORKSPACE}/package-version")"
          package="${GITHUB_WORKSPACE}/packages/suikoden-hd-remaster-save-editor-${version}-1.x86_64.rpm"
          source/scripts/gitea-publish-package.sh \
            rpm Robert root suikoden-hd-remaster-save-editor "${version}" "${package}"
          source/scripts/gitea-release-assets.sh "${REF_NAME}" "${package}"
