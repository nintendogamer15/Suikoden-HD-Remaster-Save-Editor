name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build-test-package:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Linux smoke and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            xvfb xauth libfontconfig1 libx11-6 libice6 libsm6 fonts-dejavu-core \
            zip jq file desktop-file-utils libxml2-utils shellcheck

      - name: Build, test, publish, smoke test, and package
        run: ./scripts/ci.sh

      - name: Upload standalone archives
        uses: actions/upload-artifact@v7.0.1
        with:
          name: standalone-builds
          path: |
            artifacts/SuikodenHdSaveEditor-linux-x64.tar.gz
            artifacts/SuikodenHdSaveEditor-windows-x64.zip
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Linux smoke and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            xvfb xauth libfontconfig1 libx11-6 libice6 libsm6 fonts-dejavu-core \
            zip jq file desktop-file-utils libxml2-utils shellcheck

      - name: Build, test, publish, smoke test, and package
        run: ./scripts/ci.sh

      - name: Prepare versioned GitHub release assets
        run: |
          tag_version="$(./scripts/project-version.sh "${GITHUB_REF_NAME}")"
          project_version="$(./scripts/project-version.sh)"
          if [ "${tag_version}" != "${project_version}" ]; then
            echo "Release tag version ${tag_version} does not match project version ${project_version}." >&2
            exit 1
          fi
          ./scripts/prepare-release-assets.sh "${GITHUB_REF_NAME}" release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "Suikoden I & II HD Remaster Save Editor ${GITHUB_REF_NAME}" \
            --generate-notes \
            "release/SuikodenHdSaveEditor-${GITHUB_REF_NAME}-linux-x64.tar.gz" \
            "release/SuikodenHdSaveEditor-${GITHUB_REF_NAME}-windows-x64.zip"
