# SPDX-License-Identifier: 0BSD
name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build-test-package:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Linux smoke and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            xvfb xauth \
            libfontconfig1 libfreetype6 libharfbuzz0b \
            libx11-6 libxext6 libxrender1 libxcb1 libxi6 \
            libice6 libsm6 fonts-dejavu-core \
            file desktop-file-utils libxml2-utils shellcheck

      - name: Build, test, publish, smoke test, and validate
        run: ./scripts/ci.sh

      - name: Upload single-file executables
        uses: actions/upload-artifact@v7.0.1
        with:
          name: standalone-builds
          path: |
            artifacts/publish/SuikodenHdSaveEditor-linux-x64/SuikodenHdSaveEditor.App
            artifacts/publish/SuikodenHdSaveEditor-windows-x64/SuikodenHdSaveEditor.App.exe
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tag
        uses: actions/checkout@v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Linux smoke and validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            xvfb xauth \
            libfontconfig1 libfreetype6 libharfbuzz0b \
            libx11-6 libxext6 libxrender1 libxcb1 libxi6 \
            libice6 libsm6 fonts-dejavu-core \
            file desktop-file-utils libxml2-utils shellcheck

      - name: Validate tag and build release executables
        run: |
          tag_version="$(./scripts/project-version.sh "${GITHUB_REF_NAME}")"
          project_version="$(./scripts/project-version.sh)"
          if [ "${tag_version}" != "${project_version}" ]; then
            echo "Release tag version ${tag_version} does not match project version ${project_version}." >&2
            exit 1
          fi
          APP_VERSION="${tag_version}" ./scripts/ci.sh
          ./scripts/prepare-release-assets.sh "${GITHUB_REF_NAME}" release

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          linux_asset="release/SuikodenHdSaveEditor-${GITHUB_REF_NAME}-linux-x64"
          windows_asset="release/SuikodenHdSaveEditor-${GITHUB_REF_NAME}-windows-x64.exe"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            for asset in "${linux_asset}" "${windows_asset}"; do
              name="$(basename "${asset}")"
              if gh release view "${GITHUB_REF_NAME}" --json assets \
                --jq '.assets[].name' | grep -Fxq "${name}"; then
                echo "Release asset ${name} already exists; preserving it."
              else
                gh release upload "${GITHUB_REF_NAME}" "${asset}"
              fi
            done
            gh release edit "${GITHUB_REF_NAME}" --draft=false --prerelease=false \
              --title "Suikoden I & II HD Remaster Save Editor ${GITHUB_REF_NAME}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "Suikoden I & II HD Remaster Save Editor ${GITHUB_REF_NAME}" \
              --generate-notes \
              "${linux_asset}" "${windows_asset}"
          fi
