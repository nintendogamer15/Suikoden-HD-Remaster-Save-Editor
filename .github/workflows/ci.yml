name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build-test-package:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install Linux smoke and archive tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            xvfb xauth \
            libfontconfig1 libfreetype6 libharfbuzz0b \
            libx11-6 libxext6 libxrender1 libxcb1 libxi6 \
            libice6 libsm6 fonts-dejavu-core \
            zip jq file desktop-file-utils libxml2-utils shellcheck

      - name: Build, test, publish, smoke test, and package
        run: ./scripts/ci.sh

      - name: Upload standalone archives
        uses: actions/upload-artifact@v7.0.1
        with:
          name: standalone-builds
          path: |
            artifacts/SuikodenHdSaveEditor-linux-x64.tar.gz
            artifacts/SuikodenHdSaveEditor-windows-x64.zip
          if-no-files-found: error

  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.1

      - name: Find and download build artifact from main CI run
        id: download
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const sha = context.sha;
            let run = null;
            // Retry up to 10 times (wait for main build to finish if pushed at same time)
            for (let i = 0; i < 10; i++) {
              const runs = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                head_sha: sha,
                per_page: 10
              });
              run = runs.data.workflow_runs.find(r =>
                r.name === 'CI' &&
                r.head_branch === 'main' &&
                (r.status === 'completed' && r.conclusion === 'success')
              );
              if (run) break;
              await new Promise(r => setTimeout(r, 30000)); // wait 30s
            }
            if (!run) {
              throw new Error(`No successful main CI run found for commit ${sha} after retries. Consider pushing tag after main CI completes.`);
            }
            core.setOutput('run_id', run.id);
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner,
              repo,
              run_id: run.id
            });
            const artifact = artifacts.data.artifacts.find(a => a.name === 'standalone-builds');
            if (!artifact) {
              throw new Error('No standalone-builds artifact found');
            }
            core.setOutput('artifact_id', artifact.id);

      - name: Download artifact
        run: |
          curl -L -H "Authorization: token ${{ github.token }}" \
            -o /tmp/artifact.zip \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${{ steps.download.outputs.artifact_id }}/zip"
          mkdir -p artifacts
          unzip -o /tmp/artifact.zip -d artifacts

      - name: Prepare versioned GitHub release assets
        run: |
          tag_version="$(./scripts/project-version.sh "${GITHUB_REF_NAME}")"
          project_version="$(./scripts/project-version.sh)"
          if [ "${tag_version}" != "${project_version}" ]; then
            echo "Release tag version ${tag_version} does not match project version ${project_version}." >&2
            exit 1
          fi
          ./scripts/prepare-release-assets.sh "${GITHUB_REF_NAME}" release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --title "Suikoden I & II HD Remaster Save Editor ${GITHUB_REF_NAME}" \
            --generate-notes \
            "release/SuikodenHdSaveEditor-${GITHUB_REF_NAME}-linux-x64.tar.gz" \
            "release/SuikodenHdSaveEditor-${GITHUB_REF_NAME}-windows-x64.zip"
