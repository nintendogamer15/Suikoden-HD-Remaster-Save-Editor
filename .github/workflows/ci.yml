name: CI

on:
  push:
  pull_request:

jobs:
  build-test-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Linux smoke and archive tools
        run: sudo apt-get update && sudo apt-get install --yes xvfb zip

      - name: Build, test, publish, smoke test, and package
        run: ./scripts/ci.sh

      - name: Upload standalone archives and checksums
        uses: actions/upload-artifact@v4
        with:
          name: standalone-builds
          path: |
            artifacts/SuikodenHdSaveEditor-linux-x64.tar.gz
            artifacts/SuikodenHdSaveEditor-windows-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
